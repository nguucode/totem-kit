name: Deploy Storybook & registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails if a generated file was hand-edited, or if a ramp was changed so
      # that an accent can no longer carry a readable label.
      - run: npm run tokens:check
      # The copy-source path has no build step on our side, so a registry item
      # that ships an unresolvable import only fails in someone else's repo.
      - run: npm run registry:check
      - run: npx playwright install --with-deps chromium
      - run: npx tsc -b
      - run: npx vitest --project storybook run
      # Verifies the npm package still builds; output isn't published here
      # (that's a separate, explicit `npm publish` step).
      - run: npm run build:lib
      - run: npm run build-storybook
      # shadcn-CLI-compatible component registry, served at /r/<name>.json
      # so consumers can run `npx shadcn add https://.../totem-kit/r/button.json`.
      - run: npx shadcn build --output storybook-static/r
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
